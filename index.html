
<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0a12">
  <meta name="description" content="江南 AI，一个拥有独立思考与鲜明个性的 AI 对话助手。">
  <meta name="color-scheme" content="dark light">

  <title>江南 AI - 不止于回答</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app" id="app">

    <!-- 左侧侧边栏 -->
    <aside class="sidebar" id="sidebar">

      <!-- 品牌区域 -->
      <div class="brand">

        <div class="brand-logo" aria-label="江南 AI 标志">
          <svg viewBox="0 0 40 40" width="28" height="28" fill="none" aria-hidden="true">
            <circle cx="20" cy="20" r="13" stroke="currentColor" stroke-width="1.7"/>
            <ellipse cx="20" cy="20" rx="6" ry="13" stroke="currentColor" stroke-width="1.5"/>
            <path d="M7 20H33" stroke="currentColor" stroke-width="1.5"/>
            <circle cx="20" cy="20" r="3" fill="currentColor"/>
          </svg>
        </div>

        <div class="brand-copy">
          <h1>江南 AI</h1>
          <p>骂我就是你急.</p>
        </div>

        <button
          class="icon-button sidebar-close"
          id="closeSidebar"
          type="button"
          aria-label="关闭侧边栏"
        >
          ×
        </button>

      </div>

      <!-- 新建对话 -->
      <button class="new-chat-button" id="newChatButton" type="button">
        <span class="plus-icon">＋</span>
        <span>开启新对话</span>
      </button>

      <!-- 历史记录 -->
      <div class="history-heading">
        <span>最近对话</span>
        <span class="history-count" id="historyCount">0</span>
      </div>

      <div class="history-list" id="historyList"></div>

      <!-- 侧边栏底部 -->
      <div class="sidebar-bottom">

        <div class="local-notice">
          <span class="status-dot"></span>

          <div>
            <strong>江南 AI 已就绪</strong>
            <p>由 AI 驱动的智能对话</p>
          </div>
        </div>

        <div class="sidebar-footer">
          <span>JIANGNAN AI</span>
          <span>·</span>
          <span>独立思考，自由表达</span>
        </div>

      </div>

    </aside>

    <!-- 手机端侧边栏遮罩 -->
    <div
      class="sidebar-overlay"
      id="sidebarOverlay"
      aria-hidden="true"
    ></div>

    <!-- 右侧主区域 -->
    <main class="main-panel" id="chatArea">

      <!-- 顶部导航 -->
      <header class="topbar">

        <div class="topbar-left">

          <button
            class="icon-button menu-button"
            id="menuButton"
            type="button"
            aria-label="打开菜单"
          >
            <span class="menu-lines">☰</span>
          </button>

          <div class="mobile-brand">
            <span class="mobile-brand-mark">
              <svg viewBox="0 0 40 40" width="19" height="19" fill="none" aria-hidden="true">
                <circle cx="20" cy="20" r="13" stroke="currentColor" stroke-width="2"/>
                <ellipse cx="20" cy="20" rx="6" ry="13" stroke="currentColor" stroke-width="1.7"/>
                <path d="M7 20H33" stroke="currentColor" stroke-width="1.7"/>
              </svg>
            </span>
            <span>江南 AI</span>
          </div>

          <div class="model-label">
            <span class="model-dot"></span>
            <span>江南智能对话</span>
          </div>

        </div>

        <div class="topbar-right">

          <span class="demo-badge">
            <span class="status-dot"></span>
            AI 已连接
          </span>

          <!-- 主题切换按钮：下一步由 script.js 添加功能 -->
          <button
            class="icon-button theme-toggle-button"
            id="themeToggleButton"
            type="button"
            aria-label="切换主题"
            title="切换深色 / 浅色主题"
          >
            <svg
              class="theme-icon"
              viewBox="0 0 24 24"
              width="19"
              height="19"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2V4"/>
              <path d="M12 20V22"/>
              <path d="M4.93 4.93L6.34 6.34"/>
              <path d="M17.66 17.66L19.07 19.07"/>
              <path d="M2 12H4"/>
              <path d="M20 12H22"/>
              <path d="M4.93 19.07L6.34 17.66"/>
              <path d="M17.66 6.34L19.07 4.93"/>
            </svg>
          </button>

        </div>

      </header>

      <!-- 聊天内容区域 -->
      <section class="chat-area">

        <!-- 欢迎页面 -->
        <div class="welcome" id="welcomeScreen">

          <!-- 原创抽象科技头像 -->
          <div class="welcome-orb" aria-hidden="true">

            <svg viewBox="0 0 100 100" width="54" height="54" fill="none">
              <circle cx="50" cy="50" r="34" stroke="currentColor" stroke-width="1.5" opacity=".45"/>
              <ellipse cx="50" cy="50" rx="15" ry="34" stroke="currentColor" stroke-width="1.5"/>
              <ellipse cx="50" cy="50" rx="34" ry="15" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="50" cy="50" r="7" fill="currentColor"/>
              <circle cx="50" cy="16" r="3" fill="currentColor"/>
              <circle cx="80" cy="50" r="3" fill="currentColor"/>
            </svg>

            <span class="orb-sparkle sparkle-one">✦</span>
            <span class="orb-sparkle sparkle-two">✧</span>

          </div>

          <h2>别急着下结论，先聊两句。</h2>

          <p class="welcome-description">
            骂我就是你急。
          </p>

          <!-- 快捷提问 -->
          <div class="suggestion-grid" id="suggestionGrid">

            <button
              class="suggestion-card"
              type="button"
              data-prompt="帮我制定一份真正可执行的高效学习计划。"
            >
              <span class="suggestion-icon icon-blue">◈</span>

              <span class="suggestion-text">
                <strong>深度思考</strong>
                <span>把复杂的问题拆解清楚</span>
              </span>

              <span class="suggestion-arrow">↗</span>
            </button>

            <button
              class="suggestion-card"
              type="button"
              data-prompt="帮我构思一个有辨识度、有创意的品牌方案。"
            >
              <span class="suggestion-icon icon-purple">✳</span>

              <span class="suggestion-text">
                <strong>创意灵感</strong>
                <span>让普通想法变得不普通</span>
              </span>

              <span class="suggestion-arrow">↗</span>
            </button>

            <button
              class="suggestion-card"
              type="button"
              data-prompt="用通俗易懂的方式解释人工智能的工作原理。"
            >
              <span class="suggestion-icon icon-cyan">⌘</span>

              <span class="suggestion-text">
                <strong>探索新知</strong>
                <span>了解技术背后的逻辑</span>
              </span>

              <span class="suggestion-arrow">↗</span>
            </button>

            <button
              class="suggestion-card"
              type="button"
              data-prompt="帮我分析一个项目，从目标到执行给出完整方案。"
            >
              <span class="suggestion-icon icon-orange">⟁</span>

              <span class="suggestion-text">
                <strong>项目规划</strong>
                <span>让想法真正落地执行</span>
              </span>

              <span class="suggestion-arrow">↗</span>
            </button>

          </div>

        </div>

        <!-- 消息列表 -->
        <div class="message-list" id="messageList"></div>

        <!-- AI 正在思考 -->
        <div class="typing-row hidden" id="typingRow">

          <div class="ai-avatar small-avatar">
            <svg viewBox="0 0 40 40" width="21" height="21" fill="none" aria-hidden="true">
              <circle cx="20" cy="20" r="13" stroke="currentColor" stroke-width="1.6"/>
              <ellipse cx="20" cy="20" rx="6" ry="13" stroke="currentColor" stroke-width="1.5"/>
              <path d="M7 20H33" stroke="currentColor" stroke-width="1.5"/>
            </svg>
          </div>

          <div class="typing-bubble">
            <span></span>
            <span></span>
            <span></span>
            <span class="typing-label">正在思考</span>
          </div>

        </div>

        <div class="chat-bottom-anchor" id="chatBottomAnchor"></div>

      </section>

      <!-- 底部输入区域 -->
      <footer class="composer-area">

        <div class="composer-shell">

          <label class="visually-hidden" for="messageInput">
            输入你想询问的内容
          </label>

          <textarea
            id="messageInput"
            rows="1"
            maxlength="4000"
            placeholder="向江南 AI 提问……"
          ></textarea>

          <div class="composer-toolbar">

            <div class="composer-hint">
              <span class="hint-icon">↵</span>
              <span>Enter 发送 · Shift + Enter 换行</span>
            </div>

            <div class="composer-actions">

              <span class="character-count" id="characterCount">
                0 / 4000
              </span>

              <button
                class="send-button"
                id="sendButton"
                type="button"
                aria-label="发送消息"
                title="发送消息"
              >
                <span>↑</span>
              </button>

            </div>

          </div>

        </div>

        <p class="disclaimer">
          AI 生成内容仅供参考，请结合实际情况判断。
        </p>

      </footer>

    </main>

  </div>

  <!-- 消息提示 -->
  <div
    class="toast"
    id="toast"
    role="status"
    aria-live="polite"
  ></div>

  <script src="script.js"></script>

</body>
</html>
